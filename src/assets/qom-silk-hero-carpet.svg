<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Original Qom silk Persian carpet composition</title>
  <desc id="desc">A unique dark sapphire, ivory and antique gold Persian Qom carpet inspired by silk medallion weaving.</desc>
  <defs>
