      <stop offset="0" stop-color="#31516c"/>
      <stop offset=".42" stop-color="#17293a"/>
      <stop offset="1" stop-color="#070b10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5dfaa"/><stop offset=".5" stop-color="#a97b34"/><stop offset="1" stop-color="#f1ca72"/>
    </linearGradient>
